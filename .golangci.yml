version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # MD4 is required for NT hash per MS-NLMP. No replacement exists.
      - path: internal/auth/ntlm/
        text: "SA1019.*md4"
        linters:
          - staticcheck
      # Interactive REPL: stdout/stderr write errors have no useful
      # recovery path, and wrapping every print in `_, _ = ...` buys
      # nothing. Suppress errcheck for the shell file specifically.
      - path: internal/ldap/shell\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/ajm4n/certigo
