version: 2

project_name: certigo

before:
  hooks:
    - go mod tidy

builds:
  - id: certigo
    main: ./cmd/certigo
    binary: certigo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/ajm4n/certigo/internal/version.Version={{ .Version }}

archives:
  - id: certigo
    ids: [certigo]
    name_template: "certigo_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: ajm4n
    name: certigo
  prerelease: auto
